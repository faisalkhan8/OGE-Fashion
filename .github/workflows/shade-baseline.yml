name: Foundation shade baseline

on:
  push:
    paths:
      - "oge_fashion/**"
      - "tests/**"
      - "docs/foundation-shade-baseline.md"
      - ".github/workflows/shade-baseline.yml"
  pull_request:
    paths:
      - "oge_fashion/**"
      - "tests/**"
      - "docs/foundation-shade-baseline.md"
      - ".github/workflows/shade-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-sample:
    name: Unit tests and sample ranking
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run sample foundation shade ranking
        run: python -m oge_fashion.shade_baseline --target-hex F3CFB3 --top-k 5
