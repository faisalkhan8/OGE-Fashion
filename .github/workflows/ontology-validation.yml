name: Ontology validation

on:
  push:
    branches: ["**"]
    paths:
      - "ontology/**"
      - "scripts/validate_ontology.py"
      - ".github/workflows/ontology-validation.yml"
  pull_request:
    paths:
      - "ontology/**"
      - "scripts/validate_ontology.py"
      - ".github/workflows/ontology-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ontology:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RDF parser
        run: python -m pip install "rdflib>=7.1,<8"
      - name: Parse ontology and verify taxonomy records
        run: python scripts/validate_ontology.py
