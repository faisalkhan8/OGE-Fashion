name: Ontology validation

on:
  push:
    branches: ["**"]
    paths:
      - "ontology/**"
      - "scripts/validate_ontology.py"
      - "scripts/reason_ontology.py"
      - "scripts/test_competency_queries.py"
      - "tests/fixtures/**"
      - ".github/workflows/ontology-validation.yml"
  pull_request:
    paths:
      - "ontology/**"
      - "scripts/validate_ontology.py"
      - ".github/workflows/ontology-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ontology:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RDF parser
        run: python -m pip install "rdflib>=7.1,<8"
      - name: Parse ontology and verify taxonomy records
        run: python scripts/validate_ontology.py
      - name: Set up Java for HermiT
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install OWL reasoner wrapper
        run: python -m pip install "owlready2>=0.52,<0.53"
      - name: Check OWL consistency and unsatisfiable classes
        run: python scripts/reason_ontology.py
      - name: Run synthetic SPARQL competency tests
        run: python scripts/test_competency_queries.py
