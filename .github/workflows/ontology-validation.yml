name: Ontology validation

on:
  push:
    branches: ["**"]
    paths:
      - "ontology/**"
      - "scripts/validate_ontology.py"
      - "scripts/reason_ontology.py"
      - "scripts/test_competency_queries.py"
      - "scripts/validate_shacl.py"
      - "scripts/test_shacl.py"
      - "tests/fixtures/**"
      - "tests/test_explanation_verifier.py"
      - "oge_fashion/explanation_verifier.py"
      - "examples/evidence_verification_demo.py"
      - "docs/evidence-grounded-explanation-verifier.md"
      - "experiments/**"
      - "requirements-research.txt"
      - ".github/workflows/ontology-validation.yml"
  pull_request:
    paths:
      - "ontology/**"
      - "scripts/validate_ontology.py"
      - "scripts/reason_ontology.py"
      - "scripts/test_competency_queries.py"
      - "scripts/validate_shacl.py"
      - "scripts/test_shacl.py"
      - "tests/fixtures/**"
      - "experiments/**"
      - "requirements-research.txt"
      - ".github/workflows/ontology-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ontology:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research and validation dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Parse ontology and verify taxonomy records
        run: python scripts/validate_ontology.py
      - name: Set up Java for HermiT
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Check OWL consistency and unsatisfiable classes
        run: python scripts/reason_ontology.py
      - name: Run synthetic SPARQL competency tests
        run: python scripts/test_competency_queries.py
      - name: Validate synthetic data against SHACL shapes
        run: python scripts/validate_shacl.py
      - name: Run positive and negative SHACL tests
        run: python scripts/test_shacl.py
      - name: Run reproducible synthetic recommender benchmark
        run: python experiments/evaluate_recommender.py
      - name: Test evidence-grounded explanation verifier
        run: python -m unittest tests.test_explanation_verifier -v
      - name: Run illustrative evidence verifier demo
        run: python examples/evidence_verification_demo.py
      - name: Verify generated benchmark outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("results/metrics.json").read_text())
          assert data["data_status"] == "synthetic_constructed_benchmark"
          assert data["test_profile_count"] > 0
          assert set(data["metrics"]) == {"A_baseline", "B_ontology_guided"}
          assert Path("results/evaluation_summary.md").is_file()
          print("PASS: deterministic synthetic benchmark outputs are present")
          PY
